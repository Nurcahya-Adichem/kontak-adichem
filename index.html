<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kontak R. Nurcahya - Adichem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef6e8;--card:#ffffff;--text:#0a2616;--muted:#5b6b60;--brand:#006b35;--brand-2:#8cc63f;--line:#dbe7d3;--wa:#25d366;--wa-text:#06361a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#07190e;--card:#0f2a18;--text:#f1f8ec;--muted:#a9bfae;--brand:#8cc63f;--brand-2:#8cc63f;--line:#1f3d29;--wa:#25d366;--wa-text:#06361a}}
:root[data-theme="dark"]{--bg:#07190e;--card:#0f2a18;--text:#f1f8ec;--muted:#a9bfae;--brand:#8cc63f;--brand-2:#8cc63f;--line:#1f3d29;--wa:#25d366;--wa-text:#06361a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:32px 24px;box-shadow:0 12px 40px rgba(0,0,0,.12);text-align:center;align-self:flex-start;margin-top:8px}
.logo{width:84px;height:84px;object-fit:contain}
.brand{font-weight:700;letter-spacing:2px;font-size:18px;margin-top:8px;color:var(--brand)}
h1{font-size:24px;margin:20px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;font:600 16px 'Poppins',sans-serif;text-decoration:none;border:0;cursor:pointer;margin-bottom:12px}
.save{background:var(--brand);color:#fff}
:root[data-theme="dark"] .save{color:#07190e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .save{color:#07190e}}
.wa{background:var(--wa);color:var(--wa-text)}
.info{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;text-align:left;font-size:14px}
.info a{color:var(--text);text-decoration:none;display:block;padding:6px 0;word-break:break-all}
.info span{color:var(--muted);display:block;font-size:12px}
.note{font-size:12px;color:var(--muted);margin:4px 0 0;min-height:16px}
</style>
</head>
